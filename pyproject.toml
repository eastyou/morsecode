[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "morsecode"
version = "0.1.0"
description = "摩尔斯电码编解码，一键生成 A4 可打印练习卡"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["morse", "morse-code", "encode", "decode", "education", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
  "Topic :: Communications",
]

[project.scripts]
morsecode = "morsecode.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/morsecode"
Source = "https://github.com/eastyou/morsecode"

[tool.setuptools]
packages = ["morsecode"]
