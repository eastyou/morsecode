name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test encode
        run: |
          python -m morsecode --text "SOS 2026" -o encoded.txt
          python -c "assert open('encoded.txt', encoding='utf-8').read().strip() == '... --- ... / ..--- ----- ..--- -....'"
      - name: Smoke test decode
        run: |
          python -m morsecode --decode "... --- ... / -.-" -o decoded.txt
          python -c "assert open('decoded.txt', encoding='utf-8').read().strip() == 'SOS K'"
      - name: Smoke test card generation
        run: |
          python -m morsecode --card --count 12 --seed 42 --title "Morse Practice" -o card.html
          python -c "page = open('card.html', encoding='utf-8').read(); assert page.count('<article') == 12; assert page.count('<section') == 5; assert 'A4 portrait' in page; assert 'Morse Practice' in page"
